name: Bug report
description: Report a reproducible defect without secrets or private evidence.
title: "[BUG] "
labels: []
body:
  - type: markdown
    attributes:
      value: Do not include secrets, customer data, raw audit evidence, or vulnerability details.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: Include the literal result status; do not report an unexecuted check as pass.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Use synthetic, non-sensitive inputs only.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Source revision
      description: Commit object name or release version, if one exists.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Public-data confirmation
      options:
        - label: This report contains no secrets, private evidence, or sensitive vulnerability details.
          required: true
